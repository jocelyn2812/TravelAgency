<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0"/>
    <title>Connexion — Travel Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg,
                #1a1a2e, #0f3460);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-box {
            background: white;
            border-radius: 25px;
            width: 100%; max-width: 420px;
            padding: 80px;
            box-shadow: 0 25px 60px
                rgba(0,0,0,0.3);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo .icon {
            width: 65px; height: 65px;
            background: linear-gradient(135deg,
                #e94560, #c73652);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px; color: white;
            margin: 0 auto 12px;
            box-shadow: 0 8px 20px
                rgba(233,69,96,0.3);
        }
        .auth-logo h4 {
            font-weight: 800; color: #1a1a2e;
            margin: 0;
        }
        .auth-logo p {
            color: #6c757d; font-size: 14px;
            margin: 5px 0 0;
        }
        .form-group { margin-bottom: 18px; }
        .form-label {
            font-weight: 600; font-size: 13px;
            color: #495057; margin-bottom: 6px;
            display: block;
        }
        .input-wrap { position: relative; }
        .input-icon {
            position: absolute; left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd; font-size: 14px;
        }
        .form-input {
            width: 100%;
            padding: 13px 15px 13px 42px;
            border: 2px solid #e9ecef;
            border-radius: 12px; font-size: 14px;
            outline: none;
            transition: all 0.2s;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }
        .form-input:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 4px
                rgba(233,69,96,0.08);
        }
        .btn-auth {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg,
                #e94560, #c73652);
            border: none; border-radius: 12px;
            color: white; font-size: 15px;
            font-weight: 700; cursor: pointer;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 8px 20px
                rgba(233,69,96,0.3);
            transition: all 0.2s;
            margin-top: 5px;
        }
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px
                rgba(233,69,96,0.4);
        }
        .alert-custom {
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex; gap: 10px;
            align-items: center;
        }
        .alert-error {
            background: rgba(220,53,69,0.08);
            border: 1px solid rgba(220,53,69,0.2);
            color: #dc3545;
        }
        .alert-success {
            background: rgba(40,167,69,0.08);
            border: 1px solid rgba(40,167,69,0.2);
            color: #28a745;
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px; color: #6c757d;
        }
        .auth-footer a {
            color: #e94560; font-weight: 600;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: #6c757d; font-size: 13px;
            text-decoration: none;
        }
        .back-link:hover { color: #e94560; }
        .test-hint {
            background: rgba(102,126,234,0.08);
            border: 1px solid rgba(102,126,234,0.15);
            border-radius: 10px;
            padding: 10px 15px;
            margin-top: 15px;
            font-size: 12px; color: #667eea;
        }
    </style>
</head>
<body>
<div class="auth-box">

    <div class="auth-logo">
        <div class="icon">✈</div>
        <h4>Connectez-vous pour réserver</h4>
        
    </div>

    <!-- Erreur connexion -->
    <div th:if="${param.error}"
         class="alert-custom alert-error">
        <i class="fas fa-exclamation-circle"></i>
        Email ou mot de passe incorrect.
    </div>

    <!-- Succès déconnexion -->
    <div th:if="${param.logout}"
         class="alert-custom alert-success">
        <i class="fas fa-check-circle"></i>
        Déconnexion réussie.
    </div>

    <!-- Succès inscription -->
    <div th:if="${success}"
         class="alert-custom alert-success">
        <i class="fas fa-check-circle"></i>
        <span th:text="${success}"></span>
    </div>

    <!--
        IMPORTANT :
        action="/client/connexion"
        method="post"
        champ : username = email
        champ : password = password
    -->
    <form action="/client/connexion"
          method="post">

        <div class="form-group">
            <label class="form-label">
                Adresse email
            </label>
            <div class="input-wrap">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email"
                       name="username"
                       class="form-input"
                       placeholder="votre@email.com"
                       required
                       autofocus/>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">
                Mot de passe
            </label>
            <div class="input-wrap">
                <i class="fas fa-lock input-icon"></i>
                <input type="password"
                       name="password"
                       class="form-input"
                       placeholder="Votre mot de passe"
                       required/>
            </div>
        </div>

        <button type="submit" class="btn-auth">
            <i class="fas fa-sign-in-alt me-2"></i>
            Se connecter
        </button>
    </form>

    

    <div class="auth-footer">
        Pas encore de compte ?
        <a href="/client/inscription">
            S'inscrire gratuitement
        </a>
    </div>
</div>
</body>
</html>
