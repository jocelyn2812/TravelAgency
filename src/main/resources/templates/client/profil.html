<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Mon Profil — Travel Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { margin: 0; background: #f8f9fa; }
        .navbar-client {
            background: linear-gradient(135deg,
                #1a1a2e, #0f3460);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .navbar-brand {
            color: white; font-size: 20px;
            font-weight: 800; text-decoration: none;
        }
        .navbar-brand span { color: #e94560; }
        .nav-btn {
            padding: 8px 18px; border-radius: 25px;
            font-size: 13px; font-weight: 600;
            text-decoration: none; transition: all 0.2s;
        }
        .nav-btn-outline {
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
        }
        .nav-btn-outline:hover {
            border-color: #e94560; color: #e94560;
        }
        .nav-btn-solid {
            background: #e94560; color: white;
            border: none;
        }

        /* HEADER PROFIL */
        .profil-hero {
            background: linear-gradient(135deg,
                #1a1a2e, #0f3460);
            padding: 50px 20px 30px;
            text-align: center; color: white;
        }
        .avatar {
            width: 100px; height: 100px;
            background: linear-gradient(135deg,
                #e94560, #c73652);
            border-radius: 50%;
            display: flex; align-items: center;
            justify-content: center;
            font-size: 40px; font-weight: 800;
            color: white; margin: 0 auto 20px;
            box-shadow: 0 10px 30px
                rgba(233,69,96,0.4);
            border: 4px solid
                rgba(255,255,255,0.2);
        }
        .profil-nom {
            font-size: 26px; font-weight: 800;
            margin-bottom: 5px;
        }
        .profil-email {
            opacity: 0.65; font-size: 15px;
            margin-bottom: 15px;
        }
        .points-badge {
            background: rgba(255,210,0,0.15);
            border: 1px solid rgba(255,210,0,0.3);
            border-radius: 25px;
            padding: 8px 22px;
            color: #ffd200; font-weight: 700;
            font-size: 15px;
            display: inline-flex;
            align-items: center; gap: 8px;
        }

        /* TABS */
        .tabs {
            background: white;
            border-bottom: 2px solid #f0f2f5;
            display: flex; gap: 0;
            padding: 0 30px;
        }
        .tab-btn {
            padding: 15px 25px; font-size: 14px;
            font-weight: 600; cursor: pointer;
            border: none; background: none;
            color: #6c757d; border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: #e94560;
            border-bottom-color: #e94560;
        }
        .tab-btn:hover { color: #e94560; }

        /* CONTENU */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* INFOS VIEW */
        .info-group {
            background: white; border-radius: 20px;
            padding: 25px; margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .info-group-title {
            font-weight: 700; color: #1a1a2e;
            font-size: 15px; margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f2f5;
            display: flex; align-items: center;
            gap: 8px;
        }
        .info-item {
            display: flex; align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f8f9fa;
        }
        .info-item:last-child { border-bottom: none; }
        .info-item .icon-wrap {
            width: 38px; height: 38px;
            background: rgba(233,69,96,0.08);
            border-radius: 10px;
            display: flex; align-items: center;
            justify-content: center;
            color: #e94560; font-size: 14px;
            margin-right: 15px; flex-shrink: 0;
        }
        .info-item .lbl {
            font-size: 12px; color: #6c757d;
            margin-bottom: 2px;
        }
        .info-item .val {
            font-size: 15px; font-weight: 600;
            color: #1a1a2e;
        }
        .info-item .val.empty {
            color: #adb5bd; font-weight: 400;
            font-style: italic;
        }

        /* MODIFIER */
        .btn-modifier {
            background: linear-gradient(135deg,
                #e94560, #c73652);
            color: white; border: none;
            border-radius: 12px;
            padding: 12px 30px; font-size: 14px;
            font-weight: 700; cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center; gap: 8px;
        }
        .btn-modifier:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px
                rgba(233,69,96,0.3);
            color: white;
        }
        .btn-annuler {
            background: transparent;
            color: #6c757d;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 11px 25px; font-size: 14px;
            font-weight: 600; cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
        }
        .btn-annuler:hover {
            border-color: #e94560;
            color: #e94560;
        }

        /* FORM MODIFIER */
        .form-label {
            font-size: 12px; font-weight: 600;
            color: #495057;
        }
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px; font-size: 14px;
            padding: 10px 14px;
            font-family: 'Poppins', sans-serif;
        }
        .form-control:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 3px
                rgba(233,69,96,0.1);
        }
        .alert-success {
            background: rgba(40,167,69,0.08);
            border: 1px solid rgba(40,167,69,0.2);
            color: #28a745; padding: 12px 15px;
            border-radius: 10px; font-size: 13px;
            margin-bottom: 15px;
        }
        .alert-error {
            background: rgba(220,53,69,0.08);
            border: 1px solid rgba(220,53,69,0.2);
            color: #dc3545; padding: 12px 15px;
            border-radius: 10px; font-size: 13px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar-client"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <a href="/client/accueil"
       class="navbar-brand">
        ✈ Travel<span>Agency</span>
    </a>
    <div style="display:flex;gap:8px;
         align-items:center">

        <a href="/client/voyages"
           class="nav-btn nav-btn-outline">
            <i class="fas fa-compass me-1"></i>
            Voyages
        </a>

        <span sec:authorize="isAuthenticated()">
            <a href="/client/mes-reservations"
               class="nav-btn nav-btn-outline">
                <i class="fas fa-calendar-check me-1"></i>
                Mes réservations
            </a>
            <a href="/client/profil"
               class="nav-btn nav-btn-outline">
                <i class="fas fa-user me-1"></i>
                Mon profil
            </a>
            <a href="/client/logout"
               class="nav-btn nav-btn-solid">
                <i class="fas fa-sign-out-alt me-1"></i>
                Déconnexion
            </a>
        </span>

        <span sec:authorize="!isAuthenticated()">
            <a href="/client/connexion"
               class="nav-btn nav-btn-outline">
                <i class="fas fa-sign-in-alt me-1"></i>
                Connexion
            </a>
            <a href="/client/inscription"
               class="nav-btn nav-btn-solid">
                <i class="fas fa-user-plus me-1"></i>
                S'inscrire
            </a>
        </span>
    </div>
</nav>
    <!-- HERO -->
    <div class="profil-hero">
        <div class="avatar"
             th:text="${#strings.substring(
             compte.nom != null ? compte.nom : 'C',
             0, 1)}">
        </div>
        <div class="profil-nom"
             th:text="${(compte.nom ?: '') + ' '
             + (compte.prenom ?: '')}">
        </div>
        <div class="profil-email"
             th:text="${compte.email}">
        </div>
        <div class="points-badge">
            <i class="fas fa-star"></i>
            <span th:text="${compte.pointsFidelite ?: 0}">
            </span> points fidélité
        </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active"
                onclick="showTab('vue')">
            <i class="fas fa-user me-2"></i>
            Mon profil
        </button>

    </div>

    <div class="container py-4">

        <!-- Messages -->
        <div th:if="${success}"
             class="alert-success">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}"
             class="alert-error">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- ===== VUE PROFIL ===== -->
        <div id="tab-vue" class="tab-content active">

            <div class="row g-4">
                <div class="col-md-6">
                    <div class="info-group">
                        <div class="info-group-title">
                            <i class="fas fa-user text-danger"></i>
                            Informations personnelles
                        </div>

                        <div class="info-item">
                            <div class="icon-wrap">
                                <i class="fas fa-id-card"></i>
                            </div>
                            <div>
                                <div class="lbl">Nom complet</div>
                                <div class="val"
                                     th:text="${compte.nom+' '+compte.prenom}">
                                </div>
                            </div>
                        </div>

                        <div class="info-item">
                            <div class="icon-wrap">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div>
                                <div class="lbl">Email</div>
                                <div class="val"
                                     th:text="${compte.email}">
                                </div>
                            </div>
                        </div>

                        <div class="info-item">
                            <div class="icon-wrap">
                                <i class="fas fa-phone"></i>
                            </div>
                            <div>
                                <div class="lbl">Téléphone</div>
                                <div class="val"
                                     th:classappend="${compte.telephone == null} ? ' empty'"
                                     th:text="${compte.telephone} ?: 'Non renseigné'">
                                </div>
                            </div>
                        </div>

                        <div class="info-item">
                            <div class="icon-wrap">
                                <i class="fas fa-birthday-cake"></i>
                            </div>
                            <div>
                                <div class="lbl">Date de naissance</div>
                                <div class="val"
                                     th:classappend="${compte.dateNaissance == null} ? ' empty'"
                                     th:text="${compte.dateNaissance} ?: 'Non renseigné'">
                                </div>
                            </div>
                        </div>

                        <div class="info-item">
                            <div class="icon-wrap">
                                <i class="fas fa-flag"></i>
                            </div>
                            <div>
                                <div class="lbl">Nationalité</div>
                                <div class="val"
                                     th:classappend="${compte.nationalite == null} ? ' empty'"
                                     th:text="${compte.nationalite} ?: 'Non renseigné'">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="info-group mb-4">
                        <div class="info-group-title">
                            <i class="fas fa-map-marker-alt text-danger"></i>
                            Adresse
                        </div>

                        <div class="info-item">
                            <div class="icon-wrap">
                                <i class="fas fa-home"></i>
                            </div>
                            <div>
                                <div class="lbl">Adresse</div>
                                <div class="val"
                                     th:classappend="${compte.adresse == null} ? ' empty'"
                                     th:text="${compte.adresse} ?: 'Non renseigné'">
                                </div>
                            </div>
                        </div>

                        <div class="info-item">
                            <div class="icon-wrap">
                                <i class="fas fa-city"></i>
                            </div>
                            <div>
                                <div class="lbl">Ville</div>
                                <div class="val"
                                     th:classappend="${compte.ville == null} ? ' empty'"
                                     th:text="${compte.ville} ?: 'Non renseigné'">
                                </div>
                            </div>
                        </div>

                        <div class="info-item">
                            <div class="icon-wrap">
                                <i class="fas fa-globe"></i>
                            </div>
                            <div>
                                <div class="lbl">Pays</div>
                                <div class="val"
                                     th:classappend="${compte.pays == null} ? ' empty'"
                                     th:text="${compte.pays} ?: 'Non renseigné'">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="info-group">
                        <div class="info-group-title">
                            <i class="fas fa-passport text-danger"></i>
                            Passeport
                        </div>

                        <div class="info-item">
                            <div class="icon-wrap">
                                <i class="fas fa-passport"></i>
                            </div>
                            <div>
                                <div class="lbl">Numéro</div>
                                <div class="val"
                                     th:classappend="${compte.numeroPasseport == null} ? ' empty'"
                                     th:text="${compte.numeroPasseport} ?: 'Non renseigné'">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-3">
                <button onclick="showTab('modifier')"
                        class="btn-modifier">
                    <i class="fas fa-edit"></i>
                    Modifier mon profil
                </button>
            </div>
        </div>

        <!-- ===== MODIFIER PROFIL ===== -->
        <div id="tab-modifier"
             class="tab-content">
            <div class="info-group">
                <form th:action="@{/client/profil/modifier}"
                      th:object="${compte}"
                      method="post"
                      novalidate>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nom *</label>
                            <input type="text"
                                   th:field="*{nom}"
                                   id="nom"
                                   class="form-control"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Prénom *</label>
                            <input type="text"
                                   th:field="*{prenom}"
                                   id="prenom"
                                   class="form-control"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Téléphone</label>
                            <input type="tel"
                                   th:field="*{telephone}"
                                   id="telephone"
                                   class="form-control"
                                   placeholder="+261 34 00 000 00"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date de naissance</label>
                            <input type="date"
                                   th:field="*{dateNaissance}"
                                   class="form-control"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nationalité</label>
                            <input type="text"
                                   th:field="*{nationalite}"
                                   id="nationalite"
                                   class="form-control"
                                   placeholder="Ex: Malagasy"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Adresse</label>
                            <input type="text"
                                   th:field="*{adresse}"
                                   class="form-control"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ville</label>
                            <input type="text"
                                   th:field="*{ville}"
                                   id="ville"
                                   class="form-control"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Pays</label>
                            <input type="text"
                                   th:field="*{pays}"
                                   id="pays"
                                   class="form-control"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">N° Passeport</label>
                            <input type="text"
                                   th:field="*{numeroPasseport}"
                                   id="passeport"
                                   class="form-control"
                                   placeholder="Ex: AB123456"
                                   style="text-transform:uppercase"/>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit"
                                class="btn-modifier">
                            <i class="fas fa-save"></i>
                            Sauvegarder
                        </button>
                        <button type="button"
                                class="btn-annuler"
                                onclick="showTab('vue')">
                            Annuler
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function showTab(name) {
    document.querySelectorAll('.tab-content')
        .forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn')
        .forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name)
        .classList.add('active');
    document.querySelectorAll('.tab-btn')
        .forEach(b => {
            if (b.getAttribute('onclick')
                    .includes(name)) {
                b.classList.add('active');
            }
        });
}

// Bloquer chiffres
['nom','prenom','nationalite','ville','pays']
    .forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('keypress', e => {
            if (/[0-9]/.test(e.key))
                e.preventDefault();
        });
    });

// Bloquer lettres dans téléphone
const tel = document.getElementById('telephone');
if (tel) {
    tel.addEventListener('keypress', e => {
        if (!/[0-9+\s]/.test(e.key))
            e.preventDefault();
    });
}

// Passeport majuscules
const pp = document.getElementById('passeport');
if (pp) {
    pp.addEventListener('input', function() {
        this.value = this.value.toUpperCase();
    });
}

// Si succès → rester sur vue
const hasSuccess = document.querySelector(
    '.alert-success');
if (hasSuccess) {
    showTab('vue');
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
